[package]
name = "n2n-core-router-rust"
version = "0.1.0"
edition = "2021"
authors = ["Center for Innovation in Cybersecurity (CISC)"]
description = "Ultra-low-latency, zero-copy Rust M2M routing engine prototype using Tokio, Axum, and Cap'n Proto."

[dependencies]
tokio = { version = "1.36", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
capnp = "0.19"
capnp-futures = "0.19"
uuid = { version = "1.7", features = ["v4", "serde"] }
napi = { version = "2.12", default-features = false, features = ["napi4", "serde-json"] }
napi-derive = "2.12"
hyper = { version = "1.0", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = { version = "0.4", features = ["util"] }
bulletproofs = "3.0"
curve25519-dalek-ng = "3.0"
merlin = "2.0"
rand = "0.8"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[[bin]]
name = "n2n_core_router"
path = "src/main.rs"
